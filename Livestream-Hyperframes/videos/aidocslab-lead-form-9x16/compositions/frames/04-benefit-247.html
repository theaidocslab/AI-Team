  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["04-benefit-247"] = tl;

    /* -----------------------------------------------------------
       Scene 1 (0.0-1.5s) — the card slides up from below and
       settles; label chrome (head, section, fields) staggers in
       behind it. Hero is clearly visible well before t=0.5s.
       ----------------------------------------------------------- */
    tl.fromTo(
      "#f247-card",
      { y: 210, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.8, ease: "power2.out" },
      0,
    );

    tl.fromTo(
      "#f247-ring",
      { opacity: 0 },
      { opacity: 0.3, duration: 1.0, ease: "power1.out" },
      0.1,
    );

    tl.fromTo(
      "#f247-card-head",
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
      0.12,
    );

    tl.fromTo(
      "#f247-section-label",
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      0.42,
    );

    tl.fromTo(
      "#f247-row1",
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      0.68,
    );

    tl.fromTo(
      "#f247-row2",
      { opacity: 0, y: 16 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      0.95,
    );

    /* -----------------------------------------------------------
       Scene 2 (1.5-3.0s) — "24/7" lands: the top strip sweeps
       light -> dark, the backdrop begins its day -> night
       crossfade, and the corner pulse begins its steady breathing.
       ----------------------------------------------------------- */
    tl.fromTo(
      "#f247-time",
      { opacity: 0, y: -14 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
      1.35,
    );

    tl.fromTo(
      "#f247-strip-sweep",
      { scaleX: 0 },
      { scaleX: 1, duration: 1.4, ease: "power1.inOut" },
      1.55,
    );

    tl.fromTo(
      "#f247-night",
      { opacity: 0 },
      { opacity: 1, duration: 1.6, ease: "power1.inOut" },
      1.55,
    );

    /* Corner pulse — "always on" signal. Bounded sine breathing,
       phase-driven so it starts at rest (sin(0)=0) with no jump
       off the entry, and keeps breathing through the Scene 3 hold. */
    const pulseEl = document.getElementById("f247-pulse");
    const PULSE_START = 1.55;
    const PULSE_DUR = 4.373 - PULSE_START;
    const PULSE_PERIOD = 1.8;
    const PULSE_CYCLES = PULSE_DUR / PULSE_PERIOD;
    const PULSE_SCALE_AMP = 0.08;
    const pulsePhase = { p: 0 };

    tl.to(
      pulsePhase,
      {
        p: Math.PI * 2 * PULSE_CYCLES,
        duration: PULSE_DUR,
        ease: "none",
        onUpdate: () => {
          const s = Math.sin(pulsePhase.p);
          pulseEl.style.transform = `scale(${1 + s * PULSE_SCALE_AMP})`;
          pulseEl.style.opacity = String(0.78 + s * 0.22);
        },
      },
      PULSE_START,
    );

    /* Scene 3 (3.0-4.373s) — backdrop settles darkest and holds;
       the pulse above is the only motion left in the frame. */
  </script>
