<template>
  <style>
    @font-face {
      font-family: "Raleway";
      src: url("assets/fonts/raleway.woff2") format("woff2");
      font-weight: 400 700;
      font-style: normal;
    }

    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      container-type: size;
      font-family: "Raleway", sans-serif;
    }

    .hook01-bg {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
    }

    .hook01-stage {
      position: absolute;
      inset: 0 0 17% 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hook01-counter-wrap {
      display: flex;
      align-items: baseline;
      justify-content: center;
      transform-origin: center center;
    }

    .hook01-digit {
      display: inline-block;
      font-family: "Raleway", sans-serif;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-size: 18cqw;
      line-height: 1;
      color: #ffffff;
    }

    .hook01-gold-wrap {
      position: relative;
      display: inline-block;
    }

    .hook01-glow {
      position: absolute;
      inset: -2.4cqw -3.2cqw;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(
        closest-side,
        rgba(232, 201, 122, 0.55),
        rgba(232, 201, 122, 0)
      );
      opacity: 0;
      pointer-events: none;
    }

    .hook01-underline {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -0.7cqw;
      height: 0.18cqw;
      background: #e8c97a;
      transform-origin: left center;
    }
  </style>

  <div id="root" data-composition-id="01-hook" data-width="1920" data-height="1080">
    <div class="clip hook01-bg" data-start="0" data-duration="3.2" data-track-index="0"></div>

    <div class="clip hook01-stage" data-start="0" data-duration="3.2" data-track-index="1">
      <div class="hook01-counter-wrap" id="hook01-counter-wrap">
        <span class="hook01-digit" id="hook01-dim"></span><span
          class="hook01-gold-wrap"
          id="hook01-gold-wrap"
          ><span class="hook01-glow" id="hook01-glow"></span
          ><span class="hook01-digit" id="hook01-gold"></span
          ><span class="hook01-underline" id="hook01-underline"></span
        ></span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};

    const hook01DimEl = document.getElementById("hook01-dim");
    const hook01GoldEl = document.getElementById("hook01-gold");
    const hook01GlowEl = document.getElementById("hook01-glow");
    const hook01GoldWrapEl = document.getElementById("hook01-gold-wrap");

    const TARGET_VALUE = 184;
    const START_SCALE = 0.5;
    const COUNT_DUR = 1.3;

    function hook01Render(v) {
      const str = String(Math.round(v));
      hook01DimEl.textContent = str.length > 1 ? str.slice(0, -1) : "";
      hook01GoldEl.textContent = str.slice(-1);
    }
    hook01Render(0);

    const tl = gsap.timeline({ paused: true });

    // Scene 1 (0.0-1.6s): count 0 -> 184, quick and clean, with matching scale growth.
    const hook01CountState = { value: 0 };
    tl.to(
      hook01CountState,
      {
        value: TARGET_VALUE,
        duration: COUNT_DUR,
        ease: "power3.out",
        onUpdate: () => hook01Render(hook01CountState.value),
      },
      0,
    );
    tl.fromTo(
      "#hook01-counter-wrap",
      { scale: START_SCALE },
      { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
      0,
    );

    // Scene 2 (1.6-2.3s): the numeral splits — majority dims to gray, one digit-group
    // stays gold-lit, underlined by a thin gold hairline. No camera move.
    tl.to(
      "#hook01-dim",
      { color: "#5a5a5a", duration: 0.5, ease: "power2.out" },
      1.6,
    );
    tl.to(
      "#hook01-gold",
      { color: "#e8c97a", duration: 0.5, ease: "power2.out" },
      1.6,
    );
    tl.to(
      "#hook01-underline",
      { scaleX: 1, duration: 0.4, ease: "power2.out" },
      1.85,
    );

    // Scene 3 (2.3-3.2s): hold — dimmed majority static; the gold fragment holds a
    // barely-perceptible glow pulse plus subtle jitter, the read that closes the hook.
    const BLOOM_START = 2.3;
    const BLOOM_DUR = 0.5;
    const GLOW_PEAK_OPACITY = 0.3;
    tl.fromTo(
      "#hook01-glow",
      { opacity: 0, scale: 0.85 },
      { opacity: GLOW_PEAK_OPACITY, scale: 1, duration: BLOOM_DUR, ease: "power2.out" },
      BLOOM_START,
    );

    const hook01BreathePhase = { p: 0 };
    tl.to(
      hook01BreathePhase,
      {
        p: Math.PI,
        duration: 0.4,
        ease: "none",
        onUpdate: () => {
          const s = Math.sin(hook01BreathePhase.p);
          hook01GlowEl.style.opacity = String(GLOW_PEAK_OPACITY + s * 0.04);
          hook01GlowEl.style.transform = `scale(${1 + s * 0.02})`;
        },
      },
      BLOOM_START + BLOOM_DUR,
    );

    const hook01JitterPhase = { p: 0 };
    tl.to(
      hook01JitterPhase,
      {
        p: Math.PI * 2 * 3,
        duration: 0.9,
        ease: "none",
        onUpdate: () => {
          const jx = Math.sin(hook01JitterPhase.p * 1.0) * 1.2;
          const jy = Math.sin(hook01JitterPhase.p * 1.7 + 1.0) * 1.0;
          hook01GoldWrapEl.style.transform = `translate(${jx}px, ${jy}px)`;
        },
      },
      BLOOM_START,
    );

    window.__timelines["01-hook"] = tl;
  </script>
</template>
