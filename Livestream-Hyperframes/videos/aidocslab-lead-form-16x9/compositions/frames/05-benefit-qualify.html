<template>
  <style>
    @font-face {
      font-family: 'Raleway';
      src: url('assets/fonts/raleway.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
      font-display: block;
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: 'Raleway', sans-serif;
    }

    .clip {
      position: absolute;
      inset: 0;
    }

    /* ---------- backdrop (full-bleed ground, own clip, lowest track) ---------- */
    #backdrop {
      background: #FFFFFF;
    }
    .geo-ring {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 46cqw;
      height: 46cqw;
      margin-left: -23cqw;
      margin-top: -23cqw;
      border: 1px solid #C9A84C;
      border-radius: 50%;
      opacity: 0;
    }
    .geo-ring::before {
      content: '';
      position: absolute;
      inset: 12%;
      border: 1px dashed #C9A84C;
      border-radius: 50%;
    }
    .geo-ring-2 {
      position: absolute;
      left: 8cqw;
      top: 68%;
      width: 16cqw;
      height: 16cqw;
      border: 1px solid #C9A84C;
      border-radius: 50%;
      opacity: 0;
    }

    /* ---------- stage: camera-wrapped world ---------- */
    #stage { }
    .camera-outer {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    .camera-inner {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    /* ---------- form card (Cartesian card component) ---------- */
    .form-card {
      position: absolute;
      left: 520px;
      top: 130px;
      width: 880px;
      padding: 44px 48px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 28px;
      background-color: rgba(255, 255, 255, 0.3);
      border: 1.34px solid #C9A84C;
      border-radius: 0;
      box-shadow: none;
      z-index: 1;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .field-label {
      font-family: 'Raleway', sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #E8C97A;
    }
    .field-value {
      height: 52px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border: 1.34px solid #C9A84C;
      background-color: rgba(255, 255, 255, 0.55);
      font-family: 'Raleway', sans-serif;
      font-weight: 400;
      font-size: 19px;
      color: #0A0A0A;
      white-space: pre;
      overflow: hidden;
    }

    .field-dropdown-trigger {
      position: relative;
    }
    .field-dropdown-caret {
      position: absolute;
      right: 20px;
      top: 50%;
      width: 9px;
      height: 9px;
      margin-top: -6px;
      border-right: 1.34px solid #C9A84C;
      border-bottom: 1.34px solid #C9A84C;
      transform: rotate(45deg);
    }

    .dropdown-panel {
      position: absolute;
      left: 0;
      top: 100%;
      margin-top: 4px;
      width: 100%;
      box-sizing: border-box;
      background-color: rgba(255, 255, 255, 0.92);
      border: 1.34px solid #C9A84C;
      box-shadow: none;
      transform-origin: 50% 0%;
      z-index: 5;
    }
    .dropdown-option {
      height: 40px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-family: 'Raleway', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: #5A5A5A;
      border-bottom: 1.34px solid #C9A84C;
      background-color: rgba(255, 255, 255, 0);
    }
    .dropdown-option:last-child {
      border-bottom: none;
    }
    .dropdown-option.selected {
      color: #0A0A0A;
      background-color: rgba(232, 201, 122, 0.28);
    }

    /* ---------- cursor + ripple (world-space actors) ---------- */
    .cursor {
      position: absolute;
      left: 0;
      top: 0;
      width: 28px;
      height: 34px;
      z-index: 20;
      pointer-events: none;
    }
    .ripple {
      position: absolute;
      left: 0;
      top: 0;
      width: 70px;
      height: 70px;
      margin-left: -35px;
      margin-top: -35px;
      border-radius: 50%;
      border: 1.5px solid #E8C97A;
      opacity: 0;
      z-index: 10;
      pointer-events: none;
    }
  </style>

  <div id="root" data-composition-id="05-benefit-qualify" data-width="1920" data-height="1080">
    <div id="backdrop" class="clip" data-start="0" data-duration="5.909" data-track-index="0">
      <div class="geo-ring" id="ring1"></div>
      <div class="geo-ring-2" id="ring2"></div>
    </div>

    <div id="stage" class="clip" data-start="0" data-duration="5.909" data-track-index="1">
      <div class="camera-outer" id="camera-outer">
        <div class="camera-inner" id="camera-inner">

          <div class="form-card">
            <div class="field">
              <div class="field-label">Your niche or specialty *</div>
              <div class="field-value"><span id="f1-text"></span></div>
            </div>
            <div class="field">
              <div class="field-label">Who is your ideal client? *</div>
              <div class="field-value"><span id="f2-text"></span></div>
            </div>
            <div class="field">
              <div class="field-label">Your main offer &amp; price *</div>
              <div class="field-value"><span id="f3-text"></span></div>
            </div>
            <div class="field field-dropdown-trigger">
              <div class="field-label">Biggest lead generation problem *</div>
              <div class="field-value" id="f4-trigger">
                <span id="f4-text"></span>
                <div class="field-dropdown-caret"></div>
              </div>
              <div class="dropdown-panel" id="dropdown-panel">
                <div class="dropdown-option" id="opt0">I get traffic but nobody books a call</div>
                <div class="dropdown-option" id="opt1">I don't know how to write copy that converts</div>
                <div class="dropdown-option" id="opt2">I have no landing page at all</div>
                <div class="dropdown-option" id="opt3">My page exists but generates zero leads</div>
                <div class="dropdown-option" id="opt4">I rely 100% on referrals and need to change that</div>
              </div>
            </div>
          </div>

          <div class="ripple" id="ripple"></div>

          <div class="cursor" id="cursor">
            <svg width="28" height="34" viewBox="0 0 28 34">
              <path d="M2 2 L2 27 L9 21 L14 31 L18 29 L13 19 L22 19 Z" fill="#E8C97A" stroke="#0A0A0A" stroke-width="1.2" stroke-linejoin="round"/>
            </svg>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    var TOTAL = 5.909;

    // ---------- content ----------
    var NICHE = "Business mindset coaching";
    var CLIENT = "Women 35–50 who feel stuck in their careers";
    var OFFER = "90-day coaching program — $2,500";
    var SELECTED = "My page exists but generates zero leads";

    var f1El = document.getElementById("f1-text");
    var f2El = document.getElementById("f2-text");
    var f3El = document.getElementById("f3-text");
    var f4El = document.getElementById("f4-text");

    // ---------- backdrop atmosphere ----------
    tl.fromTo("#ring1", { opacity: 0 }, { opacity: 0.32, duration: 0.5, ease: "power1.out" }, 0);
    tl.fromTo("#ring2", { opacity: 0 }, { opacity: 0.2, duration: 0.5, ease: "power1.out" }, 0.1);

    // ---------- camera: multi-phase chase (outer scale, inner counter-translate) ----------
    var outer = document.getElementById("camera-outer");
    var inner = document.getElementById("camera-inner");
    var camera = { scale: 1, ty: 0 };
    function paintCamera() {
      outer.style.transform = "scale(" + camera.scale + ")";
      inner.style.transform = "translate(0px, " + camera.ty + "px)";
    }
    paintCamera();

    // targets: field1 y=225 -> ty=315 ; field2 y=330 -> ty=210 ; field3 y=435 -> ty=105 ; field4 y=540 -> ty=0
    tl.to(camera, { scale: 1.12, ty: 315, duration: 0.7, ease: "power2.out", onUpdate: paintCamera }, 1.1);
    tl.to(camera, { scale: 1.16, ty: 210, duration: 0.5, ease: "power2.out", onUpdate: paintCamera }, 2.3);
    tl.to(camera, { scale: 1.2, ty: 105, duration: 0.5, ease: "power2.out", onUpdate: paintCamera }, 3.0);
    tl.to(camera, { scale: 1.24, ty: 0, duration: 0.6, ease: "power2.out", onUpdate: paintCamera }, 3.85);

    // ---------- cursor + click-ripple helper ----------
    var cursor = document.getElementById("cursor");
    var ripple = document.getElementById("ripple");

    tl.set(cursor, { x: 2000, y: 90 }, 0);

    function moveCursor(x, y, at, dur) {
      tl.to(cursor, { x: x, y: y, duration: dur, ease: "power3.out" }, at);
    }
    function clickAt(x, y, at) {
      tl.to(cursor, { scale: 0.85, duration: 0.08, ease: "power2.in", yoyo: true, repeat: 1 }, at);
      tl.set(ripple, { x: x, y: y, scale: 0, opacity: 1 }, at);
      tl.to(ripple, { scale: 4, opacity: 0, duration: 0.6, ease: "power2.out" }, at);
    }

    // ---------- Scene 1 (0.0-1.1s): cursor enters, clicks into "niche" field ----------
    moveCursor(620, 225, 0.05, 0.55);
    clickAt(620, 225, 0.62);

    tl.fromTo(
      document.querySelectorAll(".form-card .field")[0].querySelector(".field-value"),
      { backgroundColor: "rgba(255,255,255,0.55)" },
      { backgroundColor: "rgba(232,201,122,0.22)", duration: 0.15, yoyo: true, repeat: 1 },
      0.62
    );

    // ---------- Scene 2 (1.1-2.3s): "Business mindset coaching" types letter by letter ----------
    var type1 = { n: 0 };
    tl.to(
      type1,
      {
        n: NICHE.length,
        duration: 1.05,
        ease: "none",
        onUpdate: function () {
          f1El.textContent = NICHE.substring(0, Math.floor(type1.n));
        },
      },
      1.15
    );

    // ---------- Scene 3 (2.3-3.4s, bleeding slightly): whip-pan to field2, then field3 ----------
    moveCursor(620, 330, 2.3, 0.3);
    clickAt(620, 330, 2.62);
    tl.fromTo(
      document.querySelectorAll(".form-card .field")[1].querySelector(".field-value"),
      { backgroundColor: "rgba(255,255,255,0.55)" },
      { backgroundColor: "rgba(232,201,122,0.22)", duration: 0.15, yoyo: true, repeat: 1 },
      2.62
    );
    var type2 = { n: 0 };
    tl.to(
      type2,
      {
        n: CLIENT.length,
        duration: 0.55,
        ease: "none",
        onUpdate: function () {
          f2El.textContent = CLIENT.substring(0, Math.floor(type2.n));
        },
      },
      2.65
    );

    moveCursor(620, 435, 3.2, 0.25);
    clickAt(620, 435, 3.47);
    tl.fromTo(
      document.querySelectorAll(".form-card .field")[2].querySelector(".field-value"),
      { backgroundColor: "rgba(255,255,255,0.55)" },
      { backgroundColor: "rgba(232,201,122,0.22)", duration: 0.15, yoyo: true, repeat: 1 },
      3.47
    );
    var type3 = { n: 0 };
    tl.to(
      type3,
      {
        n: OFFER.length,
        duration: 0.35,
        ease: "none",
        onUpdate: function () {
          f3El.textContent = OFFER.substring(0, Math.floor(type3.n));
        },
      },
      3.5
    );

    // ---------- Scene 4 (3.4-5.909s): dropdown opens, selects, closes; camera settles + holds ----------
    var panel = document.getElementById("dropdown-panel");
    var opt3 = document.getElementById("opt3");
    tl.set(panel, { scale: 0, opacity: 0 }, 0);

    moveCursor(620, 540, 3.9, 0.3);
    clickAt(620, 540, 4.22);
    tl.fromTo(
      panel,
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.35, ease: "power3.out" },
      4.3
    );

    moveCursor(620, 710, 4.7, 0.35);
    clickAt(620, 710, 5.07);
    tl.to(panel, { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, 5.15);

    moveCursor(700, 540, 5.45, 0.25);

    // discrete state swaps (selection highlight + trigger text) — reverse-searched from a
    // single linear driver so every seek, forward or backward, renders the correct state.
    var driver = { t: 0 };
    tl.to(
      driver,
      {
        t: TOTAL,
        duration: TOTAL,
        ease: "none",
        onUpdate: function () {
          var chosen = driver.t >= 5.07;
          opt3.style.backgroundColor = chosen ? "rgba(232,201,122,0.28)" : "rgba(255,255,255,0)";
          opt3.style.color = chosen ? "#0A0A0A" : "#5A5A5A";
          f4El.textContent = driver.t >= 5.15 ? SELECTED : "";
        },
      },
      0
    );

    window.__timelines["05-benefit-qualify"] = tl;
  </script>
</template>
