<template>
  <style>
    @font-face {
      font-family: 'Raleway';
      src: url('assets/fonts/raleway.woff2') format('woff2');
      font-weight: 400 700;
      font-style: normal;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: 'Raleway', sans-serif;
    }

    .clip {
      position: absolute;
    }

    /* full-bleed ground — dedicated clip layer, never painted on #root */
    .cta08-bg {
      inset: 0;
      background: #FFFFFF; /* bg-primary */
    }

    /* compass-drafted atmosphere ring behind the closing lockup (Closing Plate) */
    .cta08-ring {
      top: 41cqw;
      left: 50%;
      width: 46cqw;
      height: 46cqw;
      margin-left: -23cqw;
      margin-top: -23cqw;
      border: 0.07cqw solid #C9A84C; /* line */
      border-radius: 50%;
      opacity: 0;
    }
    .cta08-ring::before {
      content: '';
      position: absolute;
      inset: 14%;
      border: 0.07cqw dashed #C9A84C;
      border-radius: 50%;
    }

    /* Scene 1 — the calm centered claim, quiet body-scale (no transform used for
       centering: fixed height + margin-top keeps GSAP free to own transform). */
    .cta08-tagline {
      top: 41cqw;
      left: 0;
      right: 0;
      height: 4cqw;
      margin-top: -2cqw;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55cqw;
      transform-origin: 50% 50%;
    }
    .cta08-word {
      font-family: 'Raleway', sans-serif;
      font-weight: 400;
      font-size: 1.4cqw; /* body-scale, re-stepped to the 1.4cqw legibility floor for 1:1 */
      line-height: 1.6;
      color: #5A5A5A; /* text-secondary */
    }

    /* Scene 3 — the mark, spring-bloomed from zero at dead center */
    .cta08-icon {
      top: 41cqw;
      left: 50%;
      width: 20cqw;
      height: 20cqw;
      margin-left: -10cqw;
      margin-top: -10cqw;
      transform-origin: 50% 50%;
    }
    .cta08-icon img {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Scene 3/4 — compact centered column beneath the mark: offer line + attribution */
    .cta08-stack {
      top: 54cqw;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8cqw;
    }
    .cta08-offer {
      font-family: 'Raleway', sans-serif;
      font-weight: 500;

      text-transform: uppercase;
      color: #E8C97A; /* accent */
    }
    .cta08-attribution {
      font-family: 'Raleway', sans-serif;
      font-weight: 400;
      font-size: 15px; /* attribution-scale */
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #E8C97A; /* accent */
    }
    .cta08-accent {
      width: 18cqw;
      height: 1px;
      background: #0A0A0A; /* text-primary — the one ink horizontal-accent line */
      transform: scaleX(0);
      transform-origin: 50% 50%;
    }
  </style>

  <div
    id="root"
    data-composition-id="08-cta"
    data-width="1080"
    data-height="1080"
    data-duration="8.256"
  >
    <div
      class="clip cta08-bg"
      data-start="0"
      data-duration="8.256"
      data-track-index="0"
    ></div>

    <div
      class="clip cta08-ring"
      data-start="0"
      data-duration="8.256"
      data-track-index="1"
    ></div>

    <!-- Scene 1 (0.0–1.3s): the calm centered claim -->
    <div
      id="cta08-tagline"
      class="clip cta08-tagline"
      data-start="0"
      data-duration="1.8"
      data-track-index="2"
    >
      <span class="cta08-word">Your</span>
      <span class="cta08-word">AI</span>
      <span class="cta08-word">lead</span>
      <span class="cta08-word">capture</span>
      <span class="cta08-word">form</span>
    </div>

    <!-- Scene 3 (2.2–3.2s): the mark spring-blooms from zero at dead center -->
    <div
      id="cta08-icon"
      class="clip cta08-icon"
      data-start="2.2"
      data-duration="6.056"
      data-track-index="3"
    >
      <img src="assets/logo-icon.svg" alt="" />
    </div>

    <!-- Scene 3/4: compact centered column — offer line, then attribution line -->
    <div
      class="clip cta08-stack"
      data-start="2.2"
      data-duration="6.056"
      data-track-index="4"
    >
      <div id="cta08-offer" class="cta08-offer">$497 · Coaching Landing Page</div>
      <div id="cta08-attribution" class="cta08-attribution">Live in 48 hours</div>
      <div id="cta08-accent" class="cta08-accent"></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const ring = document.querySelector('.cta08-ring');
    const tagline = document.getElementById('cta08-tagline');
    const words = gsap.utils.toArray('.cta08-word');
    const icon = document.getElementById('cta08-icon');
    const offer = document.getElementById('cta08-offer');
    const attribution = document.getElementById('cta08-attribution');
    const accent = document.getElementById('cta08-accent');
    const lockupGroup = [icon, document.querySelector('.cta08-stack')];

    // Scene 1 (0.0–1.3s) — word-by-word staggered fade-through-grey, left→right,
    // finishing well inside the window, then a quiet hold to the clear.
    words.forEach((el, i) => {
      tl.fromTo(
        el,
        { opacity: 0.35, color: '#C7C7C7' },
        { opacity: 1, color: '#5A5A5A', duration: 0.4, ease: 'power2.out' },
        i * 0.12,
      );
    });

    // Ambient compass ring breathes in behind the stage from the start.
    tl.fromTo(ring, { opacity: 0 }, { opacity: 0.26, duration: 1.2, ease: 'power1.out' }, 0);

    // Scene 2 (1.3–2.2s) — the CLEAR: shrink-toward-center + fade, leaving a blank
    // frame for a beat (scale-swap-transition's exit half).
    tl.to(
      tagline,
      { scale: 0.72, opacity: 0, duration: 0.4, ease: 'power2.in' },
      1.3,
    );

    // Scene 3 (2.2–3.2s) — the mark spring-blooms from ZERO at dead center
    // (spring-pop-entrance: power3-driven settle, minimal overshoot, a hint of
    // rotation as it grows).
    tl.fromTo(
      icon,
      { scale: 0, opacity: 0, rotation: -8 },
      { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: 'back.out(1.3)' },
      2.2,
    );

    // "$497 · Coaching Landing Page" reveals stacked below the mark, cascading
    // in just behind the bloom.
    tl.fromTo(
      offer,
      { opacity: 0, y: 14 },
      { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
      2.55,
    );

    // Scene 4 (3.2–4.5s) — "LIVE IN 48 HOURS" settles beneath, then a short ink
    // horizontal-accent line draws in to close the lockup.
    tl.fromTo(
      attribution,
      { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' },
      3.2,
    );
    tl.to(accent, { scaleX: 1, duration: 0.4, ease: 'power2.out' }, 3.65);

    // The whole compact lockup holds dead static — the video's longest hold —
    // with one near-imperceptible slow scale-up carrying it to the end.
    lockupGroup.forEach((el) => {
      tl.to(el, { scale: 1.015, duration: 4.606, ease: 'none' }, 3.65);
    });

    window.__timelines['08-cta'] = tl;
  </script>
</template>
