      var selectValue = root.querySelector('#qf05-select-value');
      var dropdown = root.querySelector('#qf05-dropdown');
      var optionTarget = root.querySelector('#qf05-option-target');

      // World-space (canvas px) coordinates — the card layout is fixed, so

      var CANVAS_CX = 540;

      var CURSOR_START = { x: 1010, y: 20 };

      var tl = gsap.timeline({ paused: true });

      // Cursor tip offset — align the SVG arrow's point (roughly 4,2 in its
      // viewBox) to the driven x/y instead of the div's top-left corner.
      var CURSOR_OFFSET_X = -4;
      var CURSOR_OFFSET_Y = -2;

      function moveCursorTo(target, at, dur, ease) {
        tl.to(
          cursor,
          { x: target.x + CURSOR_OFFSET_X, y: target.y + CURSOR_OFFSET_Y, duration: dur, ease: ease || 'power3.out' },
          at
        );
      }

      function clickAt(targetEl, at) {
        tl.to(cursor, { scale: 0.82, duration: 0.07, ease: 'power2.in', yoyo: true, repeat: 1 }, at);
        if (targetEl) {
          tl.to(targetEl, { scale: 0.97, duration: 0.07, ease: 'power2.in', yoyo: true, repeat: 1 }, at);
        }
      }

      function rippleAt(point, at, scaleTo, dur) {
        tl.set([ripple1, ripple2], { x: point.x, y: point.y, scale: 0, opacity: 1 }, at);
        tl.to(
          [ripple1, ripple2],
          { scale: scaleTo || 3.4, opacity: 0, duration: dur || 0.4, ease: 'power2.out', stagger: 0.08 },
          at + 0.02
        );
      }

      function typeSmooth(valueEl, placeholderEl, caretEl, text, startAt, dur) {
        tl.to(placeholderEl, { opacity: 0, duration: 0.1 }, startAt);
        tl.set(caretEl, { opacity: 1 }, startAt);
        var len = { v: 0 };
        tl.to(
          len,
          {
            v: text.length,
            duration: dur,
            ease: 'power1.inOut',
            onUpdate: function () {
              valueEl.textContent = text.substring(0, Math.floor(len.v));
            },
          },
          startAt
        );
        tl.to(caretEl, { opacity: 0, duration: 0.2 }, startAt + dur + 0.2);
      }

      // Camera math — nested outer/inner (coordinate-target-zoom): outer
      // scales around center, inner counter-translates so the acted-on
      // field lands toward viewport center. CHASE < 1 gives a push-in that
      // tracks the cursor without over-centering (keeps everything,
      // including the dropdown list opening below field 4, inside the
      // caption keep-out).
      var CHASE = 0.55;
      function counterY(fieldY) {
        var offset = fieldY - CANVAS_CY;
        return -offset * CHASE;
      }

      tl.set(cameraOuter, { scale: 1 }, 0);
      tl.set(cameraInner, { x: 0, y: 0 }, 0);
      tl.set(cursor, { x: CURSOR_START.x + CURSOR_OFFSET_X, y: CURSOR_START.y + CURSOR_OFFSET_Y }, 0);

      rippleAt(FIELD2, 2.58, 3.0, 0.3);

      moveCursorTo(FIELD4, 4.0, 0.3, 'power3.out');
      tl.to(cameraOuter, { scale: 1.16, duration: 0.4, ease: 'power3.inOut' }, 4.0);
      tl.to(cameraInner, { y: counterY(FIELD4.y), duration: 0.4, ease: 'power3.inOut' }, 4.0);
      tl.to(selectBox, { borderColor: 'var(--accent)', duration: 0.1 }, 4.28);
